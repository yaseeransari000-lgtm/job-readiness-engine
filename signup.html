{% extends "base.html" %}
{% block title %}Sign Up - SkillGap{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card panel fade-in-up">
        <span class="corner-bl"></span><span class="corner-br"></span>
        <div class="eyebrow">AUTH // REGISTER</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Apni job-readiness journey shuru karo</p>

        <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
            <div class="input-group">
                <input type="text" name="name" placeholder=" " required>
                <label>Full Name</label>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder=" " required>
                <label>Email</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder=" " required>
                <label>Password</label>
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>

        <p class="auth-switch">Already account hai? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
